---
version: "0.0.1" #Specifies the Release version these tests refer to. Usually specified by the Product Owner.
capability: "Example Capability" #This is a named Capability / Component. Usually specified by the Product Owner.
storyboards: #Lists the Storyboards representing end to end tests. Each Capability must contain at least one Storyboard. Usually specified by the Product Owner.
  "1st Story Board": #This is a named Storyboard & should be unique within the named Capability. A /c2e/{$version}/{$capability}/{$version} - {$capability} - {$storyboard}.spec.js file. Variables are not persisted outside of the storyboard.
    scenes: #Lists the Scenes in the Storyboard. Scenes are used to provide additional test file structure and are optional. Usually specified by the Product Owner.
      "Storyboard setup":
        actions:
          "Simple variable assignment e.g. varSB1 = 4 * 4": |
            //js
            varSB1 = 4 * 4;
            //!js
          "Import modules": |
            //js
            import * as ExampleImports from '../../example-imports.js';
            //!js
          "Load Schema": |
            //js
              schema = {
                  $id: "test",
                  type: "object",
                  properties: {
                      foo: { type: "integer" },
                      bar: { type: "string" }
                  },
                  required: ["foo"],
                  additionalProperties: false
              };
              ajv.addSchema(schema, schema.$id);
            //!js
      "1st Scene": #This is the first scene & has 2 user stories
        actions: #List of specific Actions to be performed preparing for or representing the User Story ACTION. Usually specified by the Solution Architect, BA or UX tester.
          "Set varScene1 to 'Scene level Variable'": |
            //js
            varScene1 = 'Scene level Variable';
            //!js
        user stories: #Lists the User Stories in the Scene. User Stories are used to provide additional test file structure and are optional. Usually specified by the Product Owner.
          "1st User Story": #This is a named User Story & must be unique under it's parent.
            actions: #List of specific Actions to be performed preparing for or representing the User Story ACTION. Usually specified by the Solution Architect, BA or UX tester.
              "Set varUserStory1 to .standardExample()": |
                //js
                varUserStory1 = ExampleImports.standardExample();
                //!js
              "Set varUserStory2 to .asyncExample()'": |
                //js
                varUserStory2 = await ExampleImports.asyncExample('Provided Import Async Example Value');
                //!js
              "Set test Data Object": |
                //js
                  data = { foo: 1, bar: "abc"};
                //!js
            expectations:
              "Check varSB1 value": |
                //js
                expect(varSB1).to.equal(16);
                //!js
              "Check varScene1 value": |
                //js
                expect(varScene1).to.equal('Scene level Variable');
                //!js
              "Check varUserStory1 value": |
                //js
                expect(varUserStory1).to.equal('Default Import Example Value');
                //!js
              "Check varUserStory2 value": |
                //js
                expect(varUserStory2).to.equal('Provided Import Async Example Value');
                //!js
              "Validate Object": |
                //js
                validateObject(data, schema);
                //!js
          "User Story 2":
            expectations:
              "1st Expectation - write to console log...": |
                //js
                console.log('Example...','User Story 2 - 1st Expectation');
                //!js
              "2nd Expectation - write to cypress log...": |
                //js
                cy.log('Example...','User Story 2 - 2nd Expectation');
                //!js
              "3rd Expectation - check varSB1":
              "4th Expectation":
      "2nd Scene":
        user stories:
          "User Story 1":
            expectations:
              "1st Expectation":
              "2nd Expectation":
              "3rd Expectation":
              "4th Expectation":
          "User Story 2":
            expectations:
              "1st Expectation":
              "2nd Expectation":
  "2nd Story Board":
    actions:
      "Simple variable assignment e.g. varSB1 = 4 * 4": |
        //js
        varSB1 = 4 * 4;
        //!js
      "Import modules": |
        //js
        import * as ExampleImports from '../../examples/example-imports.js';
        //!js
      "Load Schema": |
        //js
          schema = {
              $id: "test",
              type: "object",
              properties: {
                  foo: { type: "integer" },
                  bar: { type: "string" }
              },
              required: ["foo"],
              additionalProperties: false
          }
          ajv.addSchema(schema, schema.$id);
        //!js
    scenes:
      "1st Scene":
        actions:
          "Set varScene1 to 'Scene level Variable'": |
            //js
            varScene1 = 'Scene level Variable';
            //!js
        user stories:
          "User Story 1":
            actions:
              "Set varUserStory1 to .standardExample()": |
                //js
                varUserStory1 = ExampleImports.standardExample();
                //!js
              "Set varUserStory2 to .asyncExample()'": |
                //js
                varUserStory2 = await ExampleImports.asyncExample('Provided Import Async Example Value');
                //!js
              "Set test Data Object": |
                //js
                  data = { foo: 1, bar: "abc", baz: null}
                //!js
            expectations:
              "Check varSB1 value": |
                //js
                expect(varSB1).to.equal(16);
                //!js
              "Check varScene1 value": |
                //js
                expect(varScene1).to.equal('Scene level Variable');
                //!js
              "Check varUserStory1 value": |
                //js
                expect(varUserStory1).to.equal('Default Import Example Value');
                //!js
              "Check varUserStory2 value": |
                //js
                expect(varUserStory2).to.equal('Provided Import Async Example Value');
                //!js
              "Validate Object": |
                //js
                validateObject(data, schema);
                //!js
          "User Story 2":
            expectations:
              "1st Expectation - write to console log...": |
                //js
                console.log('Example...','User Story 2 - 1st Expectation');
                //!js
              "2nd Expectation - write to cypress log...": |
                //js
                cy.log('Example...','User Story 2 - 2nd Expectation');
                //!js
              "1st Expectation - check varSB1":
              "2nd Expectation":
      "2nd Scene":
        user stories:
          "User Story 1":
            expectations:
              "1st Expectation":
              "2nd Expectation":
              "3rd Expectation":
              "4th Expectation":
          "User Story 2":
            expectations:
              "1st Expectation":
              "2nd Expectation":
